name: shs-stack

services:
  shs-worker:
    build:
      context: ..
      dockerfile: SecureHomeSystem/Dockerfile
    image: shs-worker:local
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - DOTNET_ENVIRONMENT=${DOTNET_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://0.0.0.0:5080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LOG_DIR:-../data/logs}:/logs
    ports:
      - "${WORKER_HEALTH_PORT:-5080}:5080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:5080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - open-webui
    profiles:
      - worker

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.3.7
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    environment:
      - WEBUI_NAME=SecureHomeGPT
      - ENABLE_PERSISTENT_CONFIG=False
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - WEBUI_AUTH=true
      - OLLAMA_MAX_GPU_MEMORY=${OLLAMA_MAX_GPU_MEMORY:-0.8}
    volumes:
      - ${DATA_DIR:-../data}/open-webui:/app/backend/data
    labels:
      shs.role: open-webui


  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6334}:6333"
    volumes:
      - ${DATA_DIR:-../data}/qdrant:/qdrant/storage
    labels:
      shs.role: qdrant

  automatic1111:
    image: sdwebui/stable-diffusion-webui:latest
    restart: unless-stopped
    profiles:
      - diffusion
    ports:
      - "${AUTOMATIC1111_PORT:-7860}:7860"
    environment:
      - COMMANDLINE_ARGS=${AUTOMATIC1111_ARGS:---listen --port 7860 --api --xformers --data-dir /data --ckpt-dir /data/Models --medvram --opt-sdp-attention}
      - NVIDIA_VISIBLE_DEVICES=${AUTOMATIC1111_GPU_SELECTION:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ${AUTOMATIC1111_DATA_DIR:-../data/automatic1111}:/data
      - ${AUTOMATIC1111_MODELS_DIR:-../models/stable-diffusion}:/data/Models
      - ${AUTOMATIC1111_WORKSPACE:-../stablediff/stable-diffusion-webui}:/workspace/stable-diffusion-webui:ro
      - ./automatic1111_patch.py:/patches/automatic1111_patch.py:ro
    entrypoint:
      - /bin/bash
      - -lc
      - |
        python /patches/automatic1111_patch.py
        exec /start.sh
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${AUTOMATIC1111_GPU_COUNT:-all}
              capabilities: [gpu]
    labels:
      shs.role: stable-diffusion

volumes: {}
